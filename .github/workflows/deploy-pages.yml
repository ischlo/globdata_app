name: Deploy to GitHub Pages

on:
  push:
    branches:
      - preview_app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize and validate Mapbox token
        run: |
          token="${VITE_MAPBOX_TOKEN}"
          token="${token#\"}"
          token="${token%\"}"
          token="${token#\'}"
          token="${token%\'}"
          if [[ ! "$token" =~ ^pk\. ]]; then
            echo "::error::Set VITE_MAPBOX_TOKEN to a public Mapbox token without wrapping quotes."
            exit 1
          fi
          printf 'VITE_MAPBOX_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
